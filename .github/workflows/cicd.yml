name: CI/CD frontend-app

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app-image-s20:${{ github.run_number }}


jobs:


  test:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test

  build-and-push:

    needs: test

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build -t ${{ env.IMAGE_NAME }} --build-arg VITE_API_URL=https://api.150.lebondeveloppeur.net . 

    - name: Login to Docker Hub
      uses: docker/login-action@v3 
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image 
      run: docker push ${{ env.IMAGE_NAME }}

  deploy-job:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Connect to the VPS using SSH
        uses: appleboy/ssh-action@master # master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |

              # Pull the latest Docker image
              sudo docker pull ${{ env.IMAGE_NAME }}
              
              # Remove the old container if it exists
              sudo docker rm -f frontend-app 

              sudo docker run -d \
              -p 127.0.0.1:3002:80 \
              --name frontend-app \
              --restart always \
              ${{ env.IMAGE_NAME }}