name: Quality Analysis pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:

   sonarqube-code-quality-scan-job:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed by Sonar for blame/new-code detection

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=DevOps-Lebondeveloppeur-Session20_frontend-app
            -Dsonar.organization=devops-lebondeveloppeur-session20

              
   trivy-image-security-scan-job:

      runs-on: ubuntu-latest
      
      steps: 

        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Install dependencies
          run: sudo apt-get update && sudo apt-get install -y curl

        - name: Download and install Trivy
          run: |
            curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-32bit.tar.gz -o trivy.tar.gz
            tar xzvf trivy.tar.gz
            sudo mv trivy /usr/local/bin/
            trivy --version

        - name: Run Trivy Docker image vulnerability scan
          run: |

            trivy fs .   


   snyk-code-security-scan-job:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependency Scanning Tool (Snyk)
        run: npm install -g snyk

      - name: Snyk Authentication
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Vulnerability Scan
        run: snyk monitor --all-projects --org=session-20
